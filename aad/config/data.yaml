# Phase 1 - data pipeline configuration.
# Every knob that changes the contents of data/processed/ lives here.

seed: 42

raw:
  dir: data/raw
  files:
    - Friday-16-02-2018_TrafficForML_CICFlowMeter.csv
    - Friday-23-02-2018_TrafficForML_CICFlowMeter.csv
  chunksize: 200000

# Columns present in the CSV that are never features.
drop_columns:
  - Timestamp

label_column: Label

# Canonical label map. Keys are slugs: lowercased, non-alphanumerics stripped.
# This is what absorbs "Brute Force -Web" vs "Brute Force-Web" vs "Brute Force  Web".
label_map:
  benign:                  {name: Benign,                 code: 0, binary: 0}
  dosattackshulk:          {name: DoS attacks-Hulk,       code: 1, binary: 1}
  dosattacksslowhttptest:  {name: DoS attacks-SlowHTTPTest, code: 2, binary: 1}
  bruteforceweb:           {name: Brute Force -Web,       code: 3, binary: 1}
  bruteforcexss:           {name: Brute Force -XSS,       code: 4, binary: 1}
  sqlinjection:            {name: SQL Injection,          code: 5, binary: 1}

# Paper's Table I naming, for the report only.
paper_type_names:
  1: Type1
  2: Type2
  3: Type3
  4: Type4
  5: Type5

clean:
  # Flow Byts/s and Flow Pkts/s are Infinity when Flow Duration == 0.
  replace_inf_with_nan: true
  # Rows with any NaN feature are unusable for gradient attacks; drop and report.
  drop_nan_rows: true
  # Exact duplicate feature+label rows. CSE-CIC-IDS2018 has many; leaving them in
  # leaks near-identical rows across the train/test boundary. See report for counts.
  drop_duplicates: true

split:
  train: 0.70
  val: 0.15
  test: 0.15
  # Stratify on the 6-way label so the 53 SQL-Injection rows survive the split.
  stratify_on: multiclass

scale:
  # MinMax to [0,1] because eps in FGSM/PGD is in input units and ART assumes
  # clip_values=(0,1). Fitted on train only; val/test are clipped after transform.
  feature_range: [0.0, 1.0]
  clip_transformed: true

output:
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: artifacts/reports
  write_interim_parquet: true
